# golangci-lint configuration for Golf Booking Application
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly
  skip-dirs:
    - vendor
    - .devcontainer
    - .vscode
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*_test\\.go$"  # Skip test files for now

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Reports suspicious constructs
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis
    - unused        # Check for unused code
    - misspell      # Fix commonly misspelled English words
    - gofmt         # Check code is gofmt-ed
    - goimports     # Check import statements are formatted
    - gocritic      # Most opinionated Go linter
    - revive        # Fast, configurable, extensible, flexible golint replacement
    - unconvert     # Remove unnecessary type conversions
    - unparam       # Find unused function parameters
    - gosec         # Security problems

  disable:
    - typecheck     # Can interfere with go workspaces

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true
    disable:
      - shadow  # Can be too noisy

  gofmt:
    simplify: true

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - commentedOutCode  # We're cleaning these manually
      - ifElseChain       # Sometimes if-else is clearer

  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"
      - name: package-comments
        severity: warning
        disabled: false

  misspell:
    locale: US

  gosec:
    excludes:
      - G104  # Audit errors not checked (covered by errcheck)
      - G304  # File path provided as taint input (too many false positives)

issues:
  exclude-rules:
    # Exclude some linters from running on test files
    - path: _test\.go
      linters:
        - gosec
        - errcheck

    # Ignore missing package comments for now (we're adding them gradually)
    - linters:
        - revive
      text: "should have a package comment"

    # Ignore long lines in generated code
    - path: ".*\\.pb\\.go"
      linters:
        - lll

  max-issues-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
