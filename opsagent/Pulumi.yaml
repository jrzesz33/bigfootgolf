name: bigfoot-golf-opsagent
runtime: go
description: BigFoot Golf OpsAgent - Neo4j and Web Application Deployment on AWS ECS Fargate

config:
  aws:region:
    description: The AWS region to deploy into
    value: us-east-1
  bigfoot-golf-opsagent:neo4j-password:
    description: Password for Neo4j database
    secret: true
  bigfoot-golf-opsagent:session-key:
    description: Session key for web application authentication
    secret: true
  bigfoot-golf-opsagent:gmail-user:
    description: Gmail user for email notifications
    value: jrzesz@gmail.com
  bigfoot-golf-opsagent:gmail-pass:
    description: Gmail password for email access
    secret: true
  bigfoot-golf-opsagent:anthropic-api-key:
    description: Anthropic API key for AI features
    secret: true
  bigfoot-golf-opsagent:neo4j-image:
    description: Neo4j Docker image to use
    value: ghcr.io/jrzesz33/bigfootgolf-db:sha-d233814
  bigfoot-golf-opsagent:web-app-image:
    description: Web application Docker image to use
    value: ghcr.io/jrzesz33/bigfootgolf-webapp:sha-3f3631d
  bigfoot-golf-opsagent:mode:
    description: Application mode (dev or prod)
    value: dev