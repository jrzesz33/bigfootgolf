config:
  tracing:
    otlpEndpoint: http://arizeai:4317
    randomSampling: false
    fields:
      add: {}
binds:
- port: 3000
  listeners:
  - protocol: HTTP
    name: bigfootmcp
    hostname: ${GWAY_HOST}
    routes:
    - policies:
        cors:
          allowOrigins:
          - "*"
          allowHeaders:
          - "*"
      backends:
      - mcp:
          targets:
          - name: mcp
            mcp:
              host: ${MCP_HOST}
- port: 3001
  listeners:
  - protocol: HTTP
    name: brock
    hostname: ${GWAY_HOST}
    routes:
    - backends:
      - ai:
          name: bedrock
          provider:
            bedrock:
              region: us-east-1
              model: ${LLM_MODEL}
      policies:
        backendAuth:
          key: ${AWS_BEARER_TOKEN_BEDROCK}