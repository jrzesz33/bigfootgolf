config:
  tracing:
    otlpEndpoint: https://localhost:4317
    randomSampling: '1'
    fields:
      add:
        span.name: '"bigfoot.chat"'
        openinference.span.kind: '"LLM"'
        llm.system: 'llm.provider'
        llm.input_messages: 'flatten_recursive(llm.prompt.map(c, {"message": c}))'
        llm.output_messages: 'flatten_recursive(llm.completion.map(c, {"role":"assistant", "content": c}))'
        llm.token_count.completion: 'llm.outputTokens'
        llm.token_count.prompt: 'llm.inputTokens'
        llm.token_count.total: 'llm.totalTokens'
        #Check these values
        input.value: 'llm.prompt'                   
        output.value: 'llm.completion'              
        # Additional Token Details (if available)
        #llm.token_count.prompt_details.cache_read: 'llm.cachedInputTokens'
        #llm.token_count.prompt_details.cache_write: 'llm.cacheWriteTokens'
        #llm.token_count.completion_details.reasoning: 'llm.reasoningTokens'
        # Tool/Function Calls
        #llm.tools: 'flatten_recursive(mcp.tools)'
        #message.tool_calls: 'flatten_recursive(llm.toolCalls.map(...))'
        tool.name: 'mcp.tool.name'
        #tool.description: 'mcp.tool.description'
        #tool.parameters: 'mcp.tool.parameters'
        #tool_call.id: 'mcp.toolCall.id'
        tool_call.function.name: 'mcp.resource.name'
        #tool_call.function.arguments: 'mcp.toolCall.function.arguments'
binds:
- port: 3000
  listeners:
  - protocol: HTTP
    name: bigfootmcp
    hostname: localhost
    routes:
    - policies:
        cors:
          allowOrigins:
          - "*"
          allowHeaders:
          - "*"
      backends:
      - mcp:
          targets:
          - name: mcp
            mcp:
              host: http://localhost:8081/mcp
- port: 3001
  listeners:
  - protocol: HTTP
    name: brock
    hostname: localhost
    routes:
    - backends:
      - ai:
          name: bedrock
          provider:
            bedrock:
              region: us-east-1
              model: global.anthropic.claude-sonnet-4-5-20250929-v1:0
      policies:
        backendAuth:
          key: bedrock-api-key-